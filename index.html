<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tamamurai</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="frame">
    <header class="title">
      <h1>tamamurai</h1>
      <p class="subtitle">小さな侍</p>
    </header>

    <p id="status" class="status">The samurai meditates beneath the sakura.</p>

    <div class="stage">
      <canvas id="canvas" width="256" height="256" aria-label="Pixel-art samurai"></canvas>
    </div>

    <section class="needs" aria-label="Samurai's needs">
      <div class="bar">
        <span class="bar-label">食 hunger</span>
        <div class="bar-track"><div id="bar-hunger" class="bar-fill"></div></div>
      </div>
      <div class="bar">
        <span class="bar-label">気 energy</span>
        <div class="bar-track"><div id="bar-energy" class="bar-fill"></div></div>
      </div>
      <div class="bar">
        <span class="bar-label">心 focus</span>
        <div class="bar-track"><div id="bar-focus" class="bar-fill"></div></div>
      </div>
      <div class="bar">
        <span class="bar-label">道 discipline</span>
        <div class="bar-track"><div id="bar-discipline" class="bar-fill"></div></div>
      </div>
    </section>

    <section class="meta">
      <span id="meta-age">Age: 0 days</span>
      <span id="meta-state">State: meditating</span>
    </section>

    <section class="actions">
      <button id="btn-feed" type="button">Feed</button>
      <button id="btn-train" type="button">Train</button>
      <button id="btn-rest" type="button">Rest</button>
    </section>

    <footer class="foot">
      <small>One decision every 15 minutes. Observe, don't manage.</small>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
